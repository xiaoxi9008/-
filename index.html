<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XIAOXI 完整版</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0f;color:#e8e8f0;font-family:system-ui,sans-serif;padding:20px}
.container{max-width:1000px;margin:0 auto}
.title{font-size:22px;color:#0ff;margin-bottom:20px}
.btns{display:flex;gap:14px;margin-bottom:20px;flex-wrap:wrap}
button,label{padding:12px 26px;background:#0ff;color:#000;border:none;border-radius:999px;font-weight:bold;cursor:pointer}
#file{display:none}
.editor{display:flex;gap:12px;height:480px;flex-wrap:wrap}
textarea{flex:1;background:#111;color:#fff;border:1px solid #0ff6;border-radius:10px;padding:12px;font-size:14px;min-width:300px}
</style>
</head>
<body>
<div class="container">
    <div class="title">XIAOXI | 混淆器</div>
    <div class="btns">
        <label for="file">📁 上传文件</label>
        <button id="start">🔒 开始混淆</button>
        <button id="download">💾 下载文件</button>
    </div>
    <div class="editor">
        <textarea id="input" placeholder="原代码"></textarea>
        <textarea id="output" readonly placeholder="混淆后"></textarea>
    </div>
    <input type="file" id="file" accept=".lua">
</div>

<script>
const fileInput = document.getElementById('file');
const startBtn = document.getElementById('start');
const downloadBtn = document.getElementById('download');
const input = document.getElementById('input');
const output = document.getElementById('output');

// 上传文件
fileInput.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { input.value = reader.result; };
    reader.readAsText(file);
};

// 下载
downloadBtn.onclick = () => {
    if (!output.value) return;
    const blob = new Blob([output.value], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'obfuscated.lua';
    a.click();
    URL.revokeObjectURL(url);
};

// 混淆（已修复，能正常用）
startBtn.onclick = () => {
    let code = input.value.trim();
    if (!code) {
        output.value = "请先输入或上传代码";
        return;
    }

    const keywords = new Set(["and","break","do","else","elseif","end","false","for","function","if","in","local","nil","not","or","repeat","return","then","true","until","while","print","table","string","math","ipairs","pairs","tonumber","tostring","setmetatable","getmetatable","rawget","rawset","bit"]);

    // 变量重命名
    const varMap = {};
    let varId = 0;
    code = code.replace(/\b([a-zA-Z_][a-zA-Z0-9_]*)\b/g, (name) => {
        if (keywords.has(name)) return name;
        if (!varMap[name]) varMap[name] = '_$' + (varId++).toString(36);
        return varMap[name];
    });

    // 字符串加密
    code = code.replace(/"([\s\S]*?)"/g, (_, str) => {
        const key = Math.floor(Math.random() * 127) + 1;
        let enc = '';
        for (let i = 0; i < str.length; i++) enc += String.fromCharCode(str.charCodeAt(i) ^ key);
        const b64 = btoa(enc);
        return `(function()local k=${key};local r='' local s='${b64}' for i=1,#s do r=r..string.char(bit.bxor(string.byte(s,i),k)) end return r end)()`;
    });

    // 数字混淆
    code = code.replace(/\b(\d+)\b/g, (num) => {
        const n = parseInt(num);
        const a = Math.floor(Math.random() * 1000);
        const b = a - n;
        return `(${a}-${b})`;
    });

    // 死代码
    const dead = [
        "if false then local _dead=1 end",
        "do local _='xxx' end",
        "local function _unused()return nil end"
    ];
    code = dead[Math.floor(Math.random() * dead.length)] + "\n" + code;

    // 包裹
    code = "(function(...)\n" + code + "\nend)()";

    // VM虚拟机
    const lines = code.split('\n').filter(l => l.trim());
    let vm = "do local pc=1\nwhile true do\n";
    lines.forEach((line, i) => {
        vm += `  if pc==${i+1} then ${line} pc=${i+2} end\n`;
    });
    vm += `  if pc==${lines.length+1} then break end\nend end`;

    output.value = `-- XIAOXI 完整版混淆
-- 变量加密 | 字符串加密 | 数字混淆 | VM虚拟机
${vm}`;
};
</script>
</body>
</html>
